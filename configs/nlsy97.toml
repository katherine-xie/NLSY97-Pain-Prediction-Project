[project]
name = "Chronic Pain Prediction Project using NLS97 and O*NET Data"
intended_user = "Students and researchers interested in exploring relationships between occupation, physical activity, sitting time, and chronic pain"

[dataset]
adapter = "csv"
name = "Subset of the National Longitudinal Survey of Youth 1997 (NLSY97)"
source = "The National Longitudinal Survey of Youth 1997 (NLSY97) public-use dataset, downloaded 2026-11-01 from https://nlsinfo.org/content/access-data-investigator/accessing-data-cohorts"
license = "The NLSY97 dataset is public-use data. Follow official NLS guidance for access, citation, and redistribution."
path = "/Users/katherinexie/Developer/CMOR-438-Fall-2026/NLSY97-Pain-Prediction-Project/data/local/nlsy97_subset_named.csv"
observation_unit = "One original NLSY97 participant (including nonrespondents)"
identifier = "PUBID__1997"
feature_columns = [
    "CV_AGE_INT_DATE__2015", # Age
    "YHEA-100__2015", # General health
    "YHEA-600AA__2015", # Vigorous physical activity
    "YHEA-600BA__2015", # Light/moderate activity
    "YHEA-600CA__2015" # Muscle-strengthening activity
]

# [tasks.regression]
# name = "REPLACE OR REMOVE WHEN MATHEMATICALLY INAPPLICABLE"
# target = "regression_target"
# metric = "root_mean_squared_error"

[tasks.classification]
name = "Predict Chronic Pain in 2019"
target = "YHEA-PAIN-1__2019"
positive_event = "Reported chronic pain in the past 30 days"
metric = "balanced_accuracy"

[tasks.unsupervised]
name = "REPLACE WITH A SCIENTIFIC STRUCTURE QUESTION"
metric = "REPLACE WITH STABILITY, RECONSTRUCTION, DENSITY, OR OTHER EVIDENCE"

[split]
random_state = 438
test_fraction = 0.25
# group_column = "subject_id"
# time_column = "measurement_time"
